<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ganath Açaí | Logo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&text=N&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9e2dc; }
    .folha { display: flex; flex-wrap: wrap; }
    .quadro { width: 1080px; height: 1080px; display: grid; place-items: center; }
    .claro { background: #fbf6f0; color: #3a1040; --ouro: #c69a4c; }
    .escuro { background: #2b0a31; color: #fff4ec; --ouro: #d6ad62; }
    .logo { width: 84%; height: auto; overflow: visible; }
    .logo-nome { fill: currentColor; font-family: "Cormorant Garamond", serif; font-weight: 500; }
    .logo-n { font-family: "Pinyon Script", cursive; font-weight: 400; }
    .logo-frase { fill: currentColor; font-family: "Cormorant Garamond", serif; font-weight: 500; letter-spacing: .2em; }
    .logo-ouro { stroke: var(--ouro); }
    .logo-ouro-cheio { fill: var(--ouro); }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="copo-traco" viewBox="0 0 200 200">
      <g fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M50 101 C44 88 54 76 66 78 C66 62 82 52 96 58 C106 46 128 50 132 64 C146 62 156 78 150 101"/>
        <path d="M46 106 Q46 100 52 100 H148 Q154 100 154 106 Q154 112 148 112 H52 Q46 112 46 106 Z"/>
        <path d="M53 112 L64 172 Q65 178 72 178 H128 Q135 178 136 172 L147 112"/>
        <path d="M54 114 Q58 114 59 121 Q60 129 64 129 Q68 129 68 121 Q69 115 75 115 H93 Q99 115 99 125 Q99 137 104 137 Q109 137 109 125 Q109 115 115 115 H124 Q130 115 131 121 Q132 127 136 127 Q140 127 141 119 L142 114"/>
        <path d="M73 138 L77 164" stroke-width="2.2"/>
        <path d="M80 89 C66 80 62 68 70 63.5 C75 61 80 64 80 67 C80 64 85 61 90 63.5 C98 68 94 80 80 89 Z"/>
        <path d="M76 61.5 L80 56.5 L84 61.5" stroke-width="2.2"/>
        <circle cx="114" cy="73" r="10.5"/>
        <rect x="-3.2" y="-24" width="6.4" height="36" rx="3.2" transform="translate(139 57) rotate(45)"/>
      </g>
      <g fill="currentColor">
        <circle cx="75.5" cy="71" r="1.3"/><circle cx="84.5" cy="70.5" r="1.3"/><circle cx="80" cy="78.5" r="1.3"/>
        <circle cx="111" cy="71" r="1.25"/><circle cx="117" cy="71" r="1.25"/><circle cx="114" cy="76" r="1.25"/>
        <circle cx="98" cy="70" r="2"/><circle cx="103" cy="86" r="1.8"/><circle cx="92" cy="93" r="1.6"/>
        <circle cx="128" cy="90" r="2"/><circle cx="61" cy="92" r="1.7"/><circle cx="121" cy="97" r="1.4"/><circle cx="70" cy="97" r="1.3"/>
      </g>
    </symbol>
    <symbol id="coracao" viewBox="-12 -12 24 24">
      <path d="M0 7 C-9 0 -11 -6 -6 -9.5 C-3 -11.5 0 -8.5 0 -6 C0 -8.5 3 -11.5 6 -9.5 C11 -6 9 0 0 7 Z"/>
    </symbol>
    <symbol id="logo-completo" viewBox="0 0 640 600">
      <path class="logo-ouro" d="M187.6 280.4 A150 150 0 0 1 306.9 60.6 M333.1 60.6 A150 150 0 0 1 452.4 280.4" fill="none" stroke-width="2.6" stroke-linecap="round"/>
      <use href="#coracao" class="logo-ouro-cheio" x="306" y="46" width="28" height="28"/>
      <use href="#copo-traco" x="203" y="64" width="234" height="234"/>
      <text class="logo-nome" x="320" y="440" text-anchor="middle" font-size="150">Ga<tspan class="logo-n" font-size="215" dx="-6" dy="6">N</tspan><tspan dx="-22" dy="-6">ath</tspan></text>
      <text class="logo-frase" x="320" y="515" text-anchor="middle" font-size="38">açaí gourmet</text>
      <path class="logo-ouro" d="M236 566 H300 M340 566 H404" stroke-width="2" stroke-linecap="round"/>
      <use href="#coracao" class="logo-ouro-cheio" x="309" y="555" width="22" height="22"/>
    </symbol>
  </svg>

  <div class="folha">
    <div class="quadro claro"><svg class="logo" viewBox="0 0 640 600" role="img" aria-label="Ganath açaí gourmet"><use href="#logo-completo"/></svg></div>
    <div class="quadro escuro"><svg class="logo" viewBox="0 0 640 600" role="img" aria-label="Ganath açaí gourmet"><use href="#logo-completo"/></svg></div>
  </div>
</body>
</html>
